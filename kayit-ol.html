<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemen Üye Ol!</title>
</head>
<body>
    <h1>Lütfen formu eksiksiz doldurunuz.</h1>

    <hr>

    <h2>Hesap Bilgileriniz</h2>

    <table>
        <tr>
            <td width="120px">
                <label for="username">Kullanıcı adı:</label>
            </td>
            <td></td>
            <td>
                <input type="text" name="username">
            </td>
        </tr>

        <tr>
            <td>
                <label for="e-posta">E-posta:</label>
            </td>
            <td></td>
            <td>
                <input type="email" name="e-posta" >
            </td>
        </tr>

        <tr>
            <td><label for="parola">Parola:</label></td>
            <td></td>
            <td>
                <input type="password" name="parola" >
            </td>
        </tr>
    </table>

    <h2>Kişisel Bilgileriniz</h2>

    <table>
        <tr>
            <td width="120px"><label for="name">Adınız:</label></td>
            <td></td>
            <td><input type="text" name="name" ></td>
        </tr>

        <tr>
            <td><label for="suname">Soyadınız:</label></td>
            <td></td>
            <td><input type="text" name="surname" ></td>
        </tr>

        <tr>
            <td><label for="sehir">Şehir:</label></td>
            <td></td>
            <td>
                <select id="sehir">
                    <option value="">Seçiniz</option>
                    <option value="">İstanbul</option>
                    <option value="">İzmir</option>
                </select>
            </td>
        </tr>

        <tr>
            <td><label for="cinsiyet">Cinsiyet:</label></td>
            <td></td>
            <td>
                <input type="radio" name="cinsiyet" >Kadın
                <input type="radio" name="cinsiyet" >Erkek
            </td>
        </tr>

        <tr>
            <td>
                <button type="submit">Kaydet</button>
            </td>
            <td></td>
            <td></td>
        </tr>
    </table>
</body>
</html>
